# 1. THE MANTA M5P (Primary MCU)
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3B00500019504D5930313820-if00

[virtual_sdcard]
path: /home/manasisv/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: none
max_velocity: 1000
max_accel: 1000

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

[fan]
pin: PA3   
hardware_pwm: True
cycle_time: 0.0001  
