# 1. THE MANTA M5P (Primary MCU)
[mcu]
serial: usb-Klipper_stm32g0b1xx_3B00500019504D5930313820-if00

[virtual_sdcard]
path: /home/manasisv/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: none
max_velocity: 1000
max_accel: 1000

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

[temperature_fan Electronics]
pin: PA3
max_power: 1.0
shutdown_speed: 0.0
control: pid
#max_delta: 1.5
sensor_type: temperature_host
min_speed: 0
max_speed: 1.0
pid_kp: 1.0
pid_ki: 0.5
pid_kd: 2.0
pid_deriv_time:2.0
min_temp: 0
max_temp: 100
target_temp: 55
