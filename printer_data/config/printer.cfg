[include mainsail.cfg]

[include macros/*.cfg]
[include config/*.cfg]

[force_move]
enable_force_move: True

[exclude_object]
[skew_correction]



[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3B00500019504D5930313820-if00

[mcu umb]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_rp2040_463432393218A685-if00
restart_method: command
##--------------------------------------------------------------------

[virtual_sdcard]
path: /home/manasisv/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 45
square_corner_velocity: 6.0


#####################################################################
#     Termperature Sensors
#####################################################################

[temperature_sensor Manta_M5P]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor CM4]
sensor_type: temperature_host
min_temp: 0
max_temp: 100


#####################################################################
#      X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: PC8
dir_pin: !PC9
enable_pin: !PA15
endstop_pin: tmc2240_stepper_x:virtual_endstop
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200                                        # Set to 400 for 0.9° degree stepper motor, 200 is for 1.8° stepper motors                                                # LDO Picobilical overrides this setting 
position_endstop: 120
position_max: 120
homing_speed: 80                                                   # Can be increased after initial setup, Max 100
# homing_retract_dist: 5
homing_retract_dist: 0
homing_positive_dir: true

[tmc2240 stepper_x]
cs_pin: PD9
spi_bus: spi2
run_current: 0.8
interpolate: True
stealthchop_threshold: 0
diag0_pin: ^!PD3
driver_sgt: 1


[stepper_y]
step_pin: PA10
dir_pin: PA14
enable_pin: !PA13
endstop_pin: tmc2240_stepper_y:virtual_endstop
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200                                        # Set to 400 for 0.9° degree stepper motor, 200 is for 1.8° stepper motors
position_endstop: 120
position_max: 120
homing_speed: 80                                                    # Can be increased after initial setup, Max 100
homing_retract_dist: 0
homing_positive_dir: true

[tmc2240 stepper_y]
cs_pin: PD8
spi_bus: spi2
run_current: 0.8
interpolate: True
stealthchop_threshold: 0  
diag0_pin: ^!PD2
driver_sgt: 1


#####################################################################
#   Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PB12
dir_pin: !PB11
enable_pin: !PA8
endstop_pin: ^PC2
rotation_distance: 8                                                # For T8x8 integrated lead screw
microsteps: 32
#position_endstop: 120                                              # Default endstp position on the bottom for v0.2
position_max: 120
position_min: -1.5
homing_speed: 10
second_homing_speed: 3.0
homing_retract_dist: 3.0

[tmc2240 stepper_z]
cs_pin: PB2
spi_bus: spi2
interpolate: True
stealthchop_threshold: 0  
## For LDO-42STH25-1004CL200E 1.0A
run_current: 0.37
stealthchop_threshold: 0  


[bed_screws]
screw1: 60,5
screw1_name: front screw
screw2: 5,115
screw2_name: back left
screw3: 115,115
screw3_name: back right


[extruder]
step_pin: PB0
dir_pin: !PB1                                                     # Add ! if moving opposite direction
enable_pin: !PC4
full_steps_per_rotation: 200                                       # Set to 200 for LDO 1.8° stepper motor, and set to 400 for OMC(StepperOnline) 0.9° stepper motor
rotation_distance: 22.4702478                                     # See calibrating rotation_distance on extruders doc
gear_ratio: 50:10                                                   # For Mini Afterburner
microsteps: 32
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23                                                  # LDO Picobilical overrides this setting 
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: ATC Semitec 104NT-4-R025H42G                           # LDO Picobilical overrides this setting
sensor_pin: gpio27                                                  # LDO Picobilical overrides this setting
#control: pid                                                        # Do PID calibration after initial checks
#pid_Kp: 28.182
#pid_Ki: 1.978
#pid_Kd: 100.397
min_temp: 0
max_temp: 270
min_extrude_temp: 170
max_extrude_only_distance: 150
max_extrude_cross_section: 30
pressure_advance: 0.0                                               # See tuning pressure advance doc
pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 5

[tmc2240 extruder]
cs_pin: PA6
spi_bus: spi2
interpolate: True
stealthchop_threshold: 0  
## For LDO-42STH25-1004CL200E 1.0A
run_current: 0.6
stealthchop_threshold: 0 


#####################################################################
#   Extruder
#####################################################################

## HE0, TH0 - Toolhead PCB
## Overwrites the extruder heater & thermistor connection
[extruder]
heater_pin: umb:gpio4
sensor_type: ATC Semitec 104GT-2 # Change this to your actual thermistor type
sensor_pin: umb:gpio29
pullup_resistor: 2200


#####################################################################
#   Fan Control
#####################################################################

## PCF - Toolhead PCB
## Overwrites the part fan connection 




#####################################################################
#   Additional Sensors
#####################################################################

[thermistor CMFB103F3950FANT]
temperature1: 0.0
resistance1: 32116.0
temperature2: 40.0
resistance2: 5309.0
temperature3: 80.0
resistance3: 1228.0

## CT - Frame PCB
## Chamber thermistor
[temperature_sensor Toolhead]
sensor_type: CMFB103F3950FANT
sensor_pin: umb:gpio28
pullup_resistor: 2200
min_temp: 0
max_temp: 100
